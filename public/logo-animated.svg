<svg xmlns="http://www.w3.org/2000/svg" viewBox="7.5 5.5 46 46" width="138" height="138" role="img" aria-label="LinnQuiz">
  <style>
    .ring { stroke: #ff2d8e; stroke-dasharray: 107;
            animation: draw .95s cubic-bezier(.65,0,.35,1) .1s both, tema 48s linear infinite; }
    .tail { stroke: #8e44d8; stroke-dasharray: 21.3;
            animation: draw-tail .4s cubic-bezier(.34,1.56,.64,1) .85s both, tema 48s linear -12s infinite; }
    @keyframes draw { from { stroke-dashoffset: 107 } to { stroke-dashoffset: 0 } }
    @keyframes draw-tail { from { stroke-dashoffset: 21.3 } to { stroke-dashoffset: 0 } }
    @keyframes tema {
      0%   { stroke: #ff2d8e }
      25%  { stroke: #8e44d8 }
      50%  { stroke: #3ad6e0 }
      75%  { stroke: #ffc94d }
      100% { stroke: #ff2d8e }
    }
    @media (prefers-reduced-motion: reduce) {
      .ring, .tail { animation: none; stroke-dashoffset: 0 }
    }
  </style>
  <circle class="ring" cx="29" cy="27" r="17" fill="none" stroke-width="9" transform="rotate(-90 29 27)"/>
  <path class="tail" d="M34 32 L49 47" fill="none" stroke-width="9" stroke-linecap="round"/>
</svg>
